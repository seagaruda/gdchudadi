<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 单机AI·锄大Dee</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            -webkit-app-region: drag;
        }

        .logo {
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.5));
        }

        .logo img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 24px;
            color: #9b59b6;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .version {
            font-family: monospace;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .detail {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            max-width: 300px;
        }

        .source-sponsor {
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
            max-width: 340px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            -webkit-app-region: no-drag;
        }

        .about-link {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .about-link:hover {
            color: #d8b4fe;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s;
            -webkit-app-region: no-drag;
            z-index: 100;
        }

        .close-btn:hover {
            color: white;
        }
    </style>
</head>

<body>
    <span class="close-btn" onclick="closeAboutWindow()">&times;</span>
    <div class="logo">
        <img src="src/assets/logo.png" alt="Guangdong Chu Da Di Logo">
    </div>

    <h1 id="about-title">单机AI·锄大Dee</h1>
    <div class="version" id="version">v1.5.24</div>

    <div class="detail" id="about-detail">
        单机AI·锄大Dee · 大陆锄大地规则的安卓竖屏版，内建本机规则 AI，完全离线执行。
        <br><br>
        基于 mesmerli 的 Taiwan Big2 AI（AGPL-3.0）改作
    </div>
    <div class="source-sponsor" id="source-sponsor"></div>
    <div id="license-status" style="margin-top: 15px; font-size: 13px; color: #94a3b8; -webkit-app-region: no-drag;"></div>

    <script src="src/i18n.js"></script>
    <script>
        function closeAboutWindow() {
            // 纯 Android 工程：关于页为独立页面，优先返回上一页，其次关闭自身
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }

        // aboutAPI 兜底实现（无 preload 时的独立页面模式）
        if (typeof window.aboutAPI === 'undefined') {
            window.aboutAPI = {
                _isStandalone: true,
                getBuildTarget: () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get('buildTarget') || 'GITHUB';
                },
                getAppInfo: () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    return {
                        version: urlParams.get('version') || '1.5.44',
                        author: urlParams.get('author') || 'SeaGaruda'
                    };
                },
                getLicenseStatus: () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const isTrial = urlParams.get('isTrial') === 'true';
                    const isActive = urlParams.get('isActive') === 'true';
                    const trialDaysRemaining = parseInt(urlParams.get('trialDaysRemaining') || '0', 10);
                    return {
                        isActive,
                        isTrial,
                        trialDaysRemaining
                    };
                },
                openExternal: (url) => {
                    window.open(url, '_blank', 'noopener,noreferrer');
                },
                closeWindow: () => {
                    closeAboutWindow();
                }
            };
        }

        const buildTarget = window.aboutAPI.getBuildTarget();
        const appInfo = window.aboutAPI.getAppInfo();
        const licenseStatus = window.aboutAPI.getLicenseStatus();

        // Get language from URL
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'zh';
        const t = (key, params = {}) => {
            const translations = typeof I18N !== 'undefined' ? I18N : (window.I18N || {});
            let str = (translations[lang] && translations[lang][key]) || (translations['en'] && translations['en'][key]) || key;
            for (const [k, v] of Object.entries(params)) {
                str = str.replace(`{${k}}`, v);
            }
            return str;
        };

        // Update UI
        document.getElementById('about-title').textContent = t('title');
        document.getElementById('version').textContent = 'v' + appInfo.version;

        document.getElementById('about-detail').innerHTML = t('aboutDetail', {
            version: appInfo.version,
            author: appInfo.author
        }).replace(/\n/g, '<br>');

        const licenseStatusEl = document.getElementById('license-status');

        if (buildTarget === 'STORE') {
            document.getElementById('source-sponsor').innerHTML = t('aboutSourceStore');
            
            // Display Microsoft Store license status
            if (!licenseStatus) {
                licenseStatusEl.textContent = t('storeCheckingLicense');
                licenseStatusEl.style.color = '#94a3b8';
            } else if (licenseStatus.isTrial) {
                const now = new Date();
                const expirationDate = new Date(licenseStatus.expirationDate);
                const daysLeft = Math.ceil((expirationDate - now) / (1000 * 60 * 60 * 24));
                licenseStatusEl.textContent = t('trialDaysLeft', { days: daysLeft });
                licenseStatusEl.style.color = '#f39c12';
            } else {
                licenseStatusEl.textContent = t('storeFullVersion');
                licenseStatusEl.style.color = '#10b981';
            }
        } else {
            document.getElementById('source-sponsor').innerHTML = t('aboutSourceSponsor');
            licenseStatusEl.textContent = t('githubVersionWarning');
            licenseStatusEl.style.color = '#ef4444';
        }

        // Bind link clicks to open externally
        const bindLink = (id, url) => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.aboutAPI.openExternal(url);
                });
            }
        };
        bindLink('github-link', 'https://github.com/mesmerli/taiwan-big-two-ai');
        bindLink('sponsor-link', 'https://ko-fi.com/mesmerli');
        bindLink('store-link', 'https://appgallery.huawei.com/');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.aboutAPI.closeWindow();
        });

    </script>
</body>
</html>
