<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Mobile Screen Adaptability & Zoom/Flicker Prevention -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Native Webview Options & Status Bar Translucency -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Avoid numerical card elements (e.g. 2, 3, 4) from being treated as Telephone links -->
    <meta name="format-detection" content="telephone=no">
    
    <title>廣東鋤大地</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="src/styles.css">
    <!-- Tailwind CSS CDN -->
    <script src="src/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        'lg-game': '900px',
                    }
                }
            }
        };
    </script>
    <!-- Fast-path platform layout injection to completely eliminate startup visual flicker -->
    <script>
        (function() {
            const isAndroid = (typeof window !== 'undefined' && (
                window.Capacitor || 
                navigator.userAgent.includes('Android') || 
                navigator.userAgent.includes('Mobile')
            ));
            if (isAndroid) {
                document.documentElement.classList.add('mobile-layout');
            }
        })();
    </script>
</head>

<body>
    <div id="game-container">
        <!-- Controls Top -->
        <div id="top-controls">
            <button id="btn-new" class="premium-btn ghost mini" data-i18n="newGame">New Game</button>
            <div id="lang-toggle" class="control-icon" title="Switch Language">🌐</div>
            <div id="mute-toggle" class="control-icon" title="Mute">🔊</div>

            <div id="info-icon" class="control-icon" title="Game Rules">i</div>
        </div>

        <div id="alert-modal" class="modal hidden">
            <div class="modal-content alert-content">
                <span class="close-btn" onclick="document.getElementById('alert-modal').classList.add('hidden')">&times;</span>
                <p id="alert-message"></p>
            </div>

        </div>

        <!-- Confirm Modal -->
        <div id="confirm-modal" class="modal hidden">
            <div class="modal-content confirm-content">
                <p id="confirm-message"></p>
                <div class="confirm-btns">
                    <button id="confirm-yes" class="premium-btn" data-i18n="yes">Yes</button>
                    <button id="confirm-no" class="premium-btn secondary" data-i18n="no">No</button>
                </div>
            </div>
        </div>

        <div id="rules-modal" class="modal hidden">
            <div class="modal-content info-modal-content">
                <span class="close-btn" onclick="document.getElementById('rules-modal').classList.add('hidden')">&times;</span>
                <h2>
                    <img src="src/assets/logo.png" alt="Logo" class="rules-logo">
                    <span data-i18n="rulesTitle">Game Rules (廣東鋤大地)</span>
                </h2>
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="rules" data-i18n="tabRules">Rules</button>
                </div>

                <div id="tab-rules" class="tab-content active">
                    <div class="rules-sections">
                        <section>
                            <h3 data-i18n="handsTitle">Hands (牌型)</h3>
                            <ul>
                                <li><strong data-i18n="rank">Rank:</strong> 2 > A > K > Q > J > 10 > 9 > 8 > 7 > 6 > 5 > 4 > 3</li>
                                <li id="rule-desc-suit"></li>
                                <li id="rule-desc-start"></li>
                                <li id="rule-desc-dragon"></li>
                                <li id="rule-desc-fivecard"></li>
                                <li id="rule-desc-bombs" class="text-violet-400 font-semibold"></li>
                            </ul>
                        </section>
                        <section>
                            <h3 data-i18n="scoringTitle">Scoring (計分)</h3>
                            <ul>
                                <li id="rule-desc-basescore"></li>
                                <li id="rule-desc-winner2"></li>
                                <li id="rule-desc-winner4"></li>
                                <li id="rule-desc-loser10"></li>
                                <li id="rule-desc-loserTwo"></li>
                                <li id="rule-desc-loserSpecial"></li>
                            </ul>
                        </section>
                    </div>
                </div>

                <div class="rules-footer">
                    <span id="rules-version"></span>
                    <span id="rules-author"></span>
                </div>
            </div>
        </div>

        <!-- 每局結束的計分表 -->
        <div id="score-modal" class="modal hidden">
            <div class="modal-content score-modal-content">
                <h2 data-i18n="roundScoreTitle">本局計分</h2>
                <p id="score-modal-winner" class="score-winner"></p>
                <table class="score-table">
                    <thead>
                        <tr>
                            <th data-i18n="thPlayer">玩家</th>
                            <th data-i18n="thRound">本局</th>
                            <th data-i18n="thTotal">累計</th>
                        </tr>
                    </thead>
                    <tbody id="score-table-body"></tbody>
                </table>
                <div class="score-modal-actions">
                    <button id="score-next-btn" class="premium-btn" data-i18n="nextRound">下一局</button>
                </div>
            </div>
        </div>

        <div class="player p2 ai" id="player-2">
            <div class="avatar-container" style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;">
                <div class="avatar"><img src="src/assets/avatars/avatar_alex.png" alt="Alex"></div>
            </div>
            <div class="speech-bubble hidden">拉</div>
            <div class="info">
                <span class="name">Alex (NPC)</span>
                <span class="cards-count">13 cards</span>
            </div>
            <div id="played-2" class="played-cards-slot"></div>
        </div>
        <div class="player p3 ai" id="player-3">
            <div class="avatar-container" style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;">
                <div class="avatar"><img src="src/assets/avatars/avatar_bella.png" alt="Bella"></div>
            </div>
            <div class="speech-bubble hidden">拉</div>
            <div class="info">
                <span class="name">Bella (NPC)</span>
                <span class="cards-count">13 cards</span>
            </div>
            <div id="played-3" class="played-cards-slot"></div>
        </div>
        <div class="player p4 ai" id="player-4">
            <div class="avatar-container" style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;">
                <div class="avatar"><img src="src/assets/avatars/orange_cat_sprite.png" alt="OrangeCat"></div>
            </div>
            <div class="speech-bubble hidden">拉</div>
            <div class="info">
                <span class="name">OrangeCat</span>
                <span class="cards-count">13 cards</span>
            </div>
            <div id="played-4" class="played-cards-slot"></div>
        </div>

        <!-- Table Center -->
        <div id="table-center">
            <div id="table-plays"><!-- 手機豎屏：四家打出的牌會搬到桌面 --></div>
            <div id="status-message">Waiting for game to start...</div>
        </div>

        <!-- Human Player -->
        <div id="human-area" class="player p1 human">
            <div class="avatar-container" style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;">
                <div class="avatar"><img src="src/assets/avatars/avatar_you.png" alt="You"></div>
            </div>
            <div class="speech-bubble hidden">拉</div>
            <div class="info"><span class="name">You</span></div>
            <div id="played-1" class="played-cards-slot"></div>
            <div id="human-cards" class="hand">
                <!-- Cards will be dynamically inserted here -->
            </div>
            <div id="controls">
                <button id="btn-play" class="premium-btn"><span class="kbd-hint">↑</span> <span data-i18n="play">Play</span></button>
                <button id="btn-pass" class="premium-btn secondary"><span class="kbd-hint space-key small"></span> <span data-i18n="pass">Pass</span></button>
                <button id="btn-hand-layout" class="premium-btn ghost mini" title="切換手牌排列 / Switch hand layout">🃏 牌型</button>
            </div>
        </div>

    </div>

    <!-- Trial Status (Moved outside to ensure it's on top) -->
    <div id="trial-status" class="hidden"></div>

    <!-- Environment & Storage Detection -->
    <script src="src/env.js"></script>
    <script src="src/version.js"></script>
    <script src="src/services/licenseService.js"></script>
    <script>
        (async function() {
            try {
                // Wait for storage (including Capacitor Preferences) to initialize
                await window.AppStorage.init();
                // 初始化授權與建置類型服務
                if (window.LicenseService && typeof window.LicenseService.init === 'function') {
                    await window.LicenseService.init();
                }
            } catch (e) {
                console.error("Failed to initialize AppStorage or LicenseService:", e);
            }
            
            // Dynamically load remaining scripts in the correct dependency order
            const scripts = [
                'src/services/systemService.js',
                'src/audio.js',
                'src/gameLogic.js',
                'src/ai/AICharacter.js',
                'src/ai/HeuristicAI.js',
                'src/ai/BigTwoAI.js',
                'src/i18n.js',
                'src/controllers/GameController.js',
                'src/views/DynamicAvatar.js',
                'src/views/GameView.js',
                'src/controllers/SettingsController.js',
                'src/controllers/KeyboardController.js',
                'src/renderer.js'
            ];
            for (const src of scripts) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = (err) => {
                        console.error("Failed to load script: " + src, err);
                        reject(err);
                    };
                    document.body.appendChild(script);
                });
            }
        })();
    </script>
</body>

</html>
